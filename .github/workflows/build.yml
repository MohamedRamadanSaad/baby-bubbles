name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/sounds-*.yml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk baby-bubbles.apk
          cp app/build/outputs/apk/debug/app-debug.apk baby-bubbles-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: baby-bubbles-${{ github.run_number }}
          path: baby-bubbles-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            baby-bubbles.apk
            baby-bubbles-${{ github.run_number }}.apk
