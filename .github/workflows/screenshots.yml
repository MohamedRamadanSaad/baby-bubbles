name: Store screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/shots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk baby-bubbles.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/shots/shoot.sh

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: shots/*.png

      - name: Publish to the screenshots branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/s && cp shots/*.png /tmp/s/
          git fetch origin screenshots || true
          git checkout --orphan screenshots-new
          git rm -rf . >/dev/null
          cp /tmp/s/*.png .
          git add *.png
          git commit -m "Store screenshots from run ${{ github.run_number }}"
          git push -f origin HEAD:screenshots
